<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目管理系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <h1>📊 项目管理</h1>
      </div>
      <nav class="nav">
        <a class="nav-item active" data-page="dashboard">
          <span class="nav-icon">📊</span>
          <span>仪表盘</span>
        </a>
        <a class="nav-item" data-page="board">
          <span class="nav-icon">✅</span>
          <span>任务看板</span>
        </a>
        <a class="nav-item" data-page="report">
          <span class="nav-icon">🎤</span>
          <span>组会汇报</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button id="themeToggle" class="btn btn-ghost">
          <span id="themeIcon">🌙</span>
          <span id="themeText">深色模式</span>
        </button>
        <div class="data-actions">
          <button id="exportBtn" class="btn btn-sm">📤 导出</button>
          <button id="importBtn" class="btn btn-sm">📥 导入</button>
          <input type="file" id="importFile" accept=".json" hidden>
        </div>
      </div>
    </aside>
    <main id="main-content"></main>
  </div>

  <div id="taskModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">新建任务</h2>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body">
        <form id="taskForm" onsubmit="return false">
          <div class="form-group">
            <label>任务标题 *</label>
            <input type="text" id="taskTitle" required placeholder="输入任务标题">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>所属项目</label>
              <input type="text" id="taskProject" list="projectList" placeholder="输入项目名称">
              <datalist id="projectList"></datalist>
            </div>
            <div class="form-group">
              <label>负责人</label>
              <input type="text" id="taskAssignee" placeholder="负责人姓名">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>状态</label>
              <select id="taskStatus">
                <option value="todo">待办</option>
                <option value="in-progress">进行中</option>
                <option value="done">已完成</option>
              </select>
            </div>
            <div class="form-group">
              <label>优先级</label>
              <select id="taskPriority">
                <option value="high">高</option>
                <option value="medium" selected>中</option>
                <option value="low">低</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>截止日期</label>
              <input type="date" id="taskDueDate">
            </div>
            <div class="form-group">
              <label>进度: <span id="progressValue">0</span>%</label>
              <input type="range" id="taskProgress" min="0" max="100" value="0" step="5">
            </div>
          </div>
          <div class="form-group">
            <label>任务描述</label>
            <textarea id="taskDescription" rows="3" placeholder="任务详细描述"></textarea>
          </div>
          <div class="form-group">
            <label>备注（问题/风险/下一步计划）</label>
            <textarea id="taskNotes" rows="3" placeholder="记录遇到的问题、风险或下一步计划"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger" id="deleteTaskBtn" style="display:none">删除任务</button>
        <div class="modal-footer-right">
          <button class="btn" id="cancelBtn">取消</button>
          <button class="btn btn-primary" id="saveTaskBtn">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
